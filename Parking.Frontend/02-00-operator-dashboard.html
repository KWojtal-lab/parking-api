<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <title>Parking+ | Dashboard Operatora</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="11-resources/01-css/style-operator.css">
    <link rel="icon" type="image/x-icon" href="11-resources/02-image/temp-favicon.ico">
    <script type="text/javascript" src="11-resources/05-js/api-client.js"></script>
    <script type="text/javascript" src="11-resources/05-js/system-status.js"></script>
    <script type="text/javascript" src="01-pages/02-00-operator-dashboard/05-js/dashboard.js"></script>
</head>
<body>
    <header>
        <section id="header-left">
            <a class="header-home" href="index.html">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h4a2 2 0 0 1 0 4H9z"/><line x1="9" y1="13" x2="9" y2="17"/>
                    </svg>
                </div>
                <h1 class="title">+gnikraP</h1>
            </a>
            <span class="system-label">System zarządzania parkingiem</span>
        </section>
        <section id="header-center">
            <div id="live-cappacity">
                <span class="dot-live"></span>
                Live: 27/50
                <div class="cap-bar"><div class="cap-bar-fill"></div></div>
                54%
            </div>
        </section>
        <section id="header-right">
            <div class="user-menu" data-user-menu>
                <button class="user-menu-trigger" type="button" data-user-trigger>
                    <span class="user-avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20a8 8 0 0 1 16 0"/>
                        </svg>
                    </span>
                    <span class="user-email" data-user-email>Nie zalogowano</span>
                    <span class="user-chevron">▾</span>
                </button>
                <div class="user-menu-dropdown" data-user-dropdown hidden>
                    <button type="button" data-user-action="settings">Ustawienia</button>
                    <button type="button" data-user-action="logout">Wyloguj</button>
                </div>
            </div>
        </section>
    </header>

    <div class="op-layout">
        <nav class="op-sidebar">
            <span class="op-sidebar-label">Panel Operatora</span>
            <a href="02-00-operator-dashboard.html" class="active">&#9783; Dashboard</a>
            <a href="02-01-operator-reports.html">&#9004; Raporty</a>
            <a href="02-02-operator-settings.html">&#9881; Ustawienia</a>
        </nav>

        <main class="op-content">
            <div class="op-page-header">
                <div>
                    <h1>Dashboard Operatora</h1>
                </div>
                <button class="btn-blue">odśwież dane</button>
            </div>

            <!-- KPI -->
            <div class="kpi-row">
                <div class="kpi-card kpi-green">
                    <div class="kpi-val" id="free"></div>
                    <div class="kpi-label">Wolne</div>
                </div>
                <div class="kpi-card kpi-red">
                    <div class="kpi-val" id="taken"></div>
                    <div class="kpi-label">Zajęte</div>
                </div>
                <div class="kpi-card kpi-blue">
                    <div class="kpi-val" id="money"></div>
                    <div class="kpi-label">Miesięczny przychód</div>
                </div>
            </div>

            <!-- Occupancy bar -->
            <div class="occupancy-card">
                <div class="occupancy-header">
                    <span>Obłożenie Parkingu</span>
                    <span class="pct"></span>
                </div>
                <div class="occ-track">
                    <div class="occ-fill" style="width:54%"></div>
                </div>
                <div class="occ-labels"><span>0%</span><span>50%</span><span>100%</span></div>
            </div>

            <!-- Alert box -->
            <!-- <div class="alert-box">
                <div class="alert-box-title">Alerty: 7 pojazdów powyżej 12 godzin</div>
                <div class="alert-tags">
                </div>
            </div> -->

            <!-- Parking grid -->
            <div class="grid-section-title">Miejsca:</div>
            <div class="parking-grid" id="parking-grid"></div>
            <div class="grid-legend">
                <div class="legend-item"><div class="legend-dot" style="background:#22C55E"></div>Wolne</div>
                <div class="legend-item"><div class="legend-dot" style="background:#EF4444"></div>Zajęte</div>
                <div class="legend-item"><div class="legend-dot" style="background:#3B82F6"></div>Niepełnosprawni</div>
            </div>
        </main>
    </div>

    <script src="11-resources/05-js/user-menu.js"></script>
</body>
</html>
