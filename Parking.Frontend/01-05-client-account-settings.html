<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <title>Parking+</title>
    <meta charset="UTF-8">
    <meta name="description" content="Most of HTML5 tags">
    <meta name="keywords" content="HTML5, tags">
    <meta name="author" content="http://blazardsky.space">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="11-resources/01-css/style2.css">
    <link rel="icon" type="image/x-icon" href="11-resources/02-image/temp-favicon.ico">
    <script type="text/javascript" src="11-resources/05-js/api-client.js"></script>
    <script type="text/javascript" src="11-resources/05-js/system-status.js"></script>
</head>
<body>
    <header>
        <section id="header-left">
            <a class="header-home" href="index.html">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h4a2 2 0 0 1 0 4H9z"/><line x1="9" y1="13" x2="9" y2="17"/>
                    </svg>
                </div>
                <h1 class="title">+gnikraP</h1>
            </a>
        </section>

        <section id="header-center">
            <div id="live-cappacity">
                <span class="dot-live"></span>
                Live: 27/50
                <div class="cap-bar"><div class="cap-bar-fill"></div></div>
                54%
            </div>
        </section>

        <section id="header-right">
            <div class="user-menu" data-user-menu>
                <button class="user-menu-trigger" type="button" data-user-trigger>
                    <span class="user-avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20a8 8 0 0 1 16 0"/>
                        </svg>
                    </span>
                    <span class="user-email" data-user-email>Nie zalogowano</span>
                    <span class="user-chevron">▾</span>
                </button>
                <div class="user-menu-dropdown" data-user-dropdown hidden>
                    <button type="button" data-user-action="settings">Ustawienia</button>
                    <button type="button" data-user-action="logout">Wyloguj</button>
                </div>
            </div>
        </section>

    </header>

    <main>
        <nav id="nav-side">
            <ul>
                <li><a href="01-01-entry.html">&#8617; Wjazd</a></li>
                <li><a href="01-02-exit.html">&#8618; Wyjazd</a></li>
                <li><a href="01-03-history.html">&#9201; Historia Parkowania</a></li>
                <li><a href="01-04-car-managment.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5"/><line x1="5" y1="13" x2="5" y2="19"/><line x1="19" y1="13" x2="19" y2="19"/><line x1="7" y1="19" x2="17" y2="19"/><circle cx="7" cy="13" r="1"/><circle cx="17" cy="13" r="1"/></svg>Menedżer pojazdów</a></li>
                <li class="active"><a href="01-05-client-account-settings.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ustawienia użytkownika</a></li>
            </ul>
        </nav>
        <section>
            <h1>Ustawienia konta</h1>
            <p class="thin-font">Zarządzaj saldem i wylogowaniem</p>

            <div class="form-group">
                <label>Aktualne saldo</label>
                <p id="account-balance">—</p>
            </div>

            <div class="form-group">
                <label for="balance-amount">Doładuj konto</label>
                <input type="number" id="balance-amount" placeholder="np. 50">
            </div>
            <div class="account-actions">
                <button class="btn-action btn-blue" id="balance-add-btn">Doładuj</button>
            </div>

            <hr style="margin: 24px 0; border: none; border-top: 1px solid #e5e7eb;">
            <h2 style="font-size: 1.1rem; margin-bottom: 4px;">Zmiana hasła</h2>
            <p class="thin-font" style="margin-bottom: 16px;">Po zmianie hasła zostaniesz automatycznie wylogowany</p>

            <div class="form-group">
                <label for="current-password">Aktualne hasło</label>
                <input type="password" id="current-password" placeholder="Aktualne hasło">
            </div>
            <div class="form-group">
                <label for="new-password">Nowe hasło</label>
                <input type="password" id="new-password" placeholder="Nowe hasło">
            </div>
            <div class="form-group">
                <label for="repeat-password">Powtórz nowe hasło</label>
                <input type="password" id="repeat-password" placeholder="Powtórz nowe hasło">
            </div>
            <div class="account-actions">
                <button class="btn-action btn-blue" id="change-password-btn">Zmień hasło</button>
                <div class="account-divider"></div>
                <button class="btn-action btn-danger" id="logout-btn">Wyloguj</button>
            </div>

            <p class="error-mgs" id="account-error-msg"></p>
            <p class="success-mgs" id="account-success-msg"></p>
        </section>
    </main>
    <script src="01-pages/01-05-client-account-settings/05-js/client-settings.js"></script>
    <script src="11-resources/05-js/user-menu.js"></script>
</body>
</html>
