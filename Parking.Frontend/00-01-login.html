<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <title>Parking+</title>
    <meta charset="UTF-8">
    <meta name="description" content="Most of HTML5 tags">
    <meta name="keywords" content="HTML5, tags">
    <meta name="author" content="http://blazardsky.space">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="11-resources/01-css/style.css">
    <link rel="icon" type="image/x-icon" href="11-resources/02-image/temp-favicon.ico">
</head>
<body>
    <header class="header-3col">
        <section id="header-left">
            <a class="header-home" href="index.html">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h4a2 2 0 0 1 0 4H9z"/><line x1="9" y1="13" x2="9" y2="17"/>
                    </svg>
                </div>
                <h1 class="title">+gnikraP</h1>
            </a>
        </section>
        <section id="header-center"></section>
        <section id="header-right">
            <div class="user-menu" data-user-menu>
                <button class="user-menu-trigger" type="button" data-user-trigger>
                    <span class="user-avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20a8 8 0 0 1 16 0"/>
                        </svg>
                    </span>
                    <span class="user-email" data-user-email>Nie zalogowano</span>
                    <span class="user-chevron">▾</span>
                </button>
                <div class="user-menu-dropdown" data-user-dropdown hidden>
                    <button type="button" data-user-action="settings">Ustawienia</button>
                    <button type="button" data-user-action="logout">Wyloguj</button>
                </div>
            </div>
        </section>
    </header>
    <main>
        <section class="auth-container">
            <h2 class="center">Witaj! Zaloguj się lub zarejestruj</h2>
            <h2 class="error-mgs" id="client-login-error-msg"></h2>

            <form id="client-login-form">
                <input type="text" inputmode="email" id="client-login" fname="client-login" placeholder="Email">
                <input type="password" id="client-password" fname="client-password" placeholder="Hasło">
                <input type="submit">
            </form>

            <p>Nie masz konta?<br><a href="00-02-registration.html">Zarejestruj się!</a></p>
        </section>
    </main>
    <script src="11-resources/05-js/api-client.js"></script>
    <script src="01-pages/00-01-login/05-js/client-login.js"></script>
    <script src="11-resources/05-js/user-menu.js"></script>
</body>
</html>
